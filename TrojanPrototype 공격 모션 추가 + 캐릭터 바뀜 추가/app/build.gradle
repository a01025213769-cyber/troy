plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.trojanprototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.trojanprototype'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2'
    }

    // 소스에 한글 주석과 대사가 들어 있으므로 UTF-8 을 명시합니다.
    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// ── 외부 라이브러리 ─────────────────────────────────────────
//  Room : 전투 기록을 기기 안의 SQLite 데이터베이스에 저장 (전적 화면)
//  Gson : 저장 슬롯을 JSON 으로 바꿔 SharedPreferences 에 저장
dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}
