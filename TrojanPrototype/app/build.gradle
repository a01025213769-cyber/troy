plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.trojanprototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.trojanprototype'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2'
    }

    // 소스에 한글 주석과 대사가 들어 있으므로 UTF-8 을 명시합니다.
    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
